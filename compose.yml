services:
  traefik:
    image: traefik:v3.5.0
    ports:
      - '80:80'
      - '443:443'
      # - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./_config/traefik:/etc/traefik:ro
    networks:
      - snowflake-network
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik.rule=Host(`traefik.localhost`)'
      - 'traefik.http.services.traefik.loadbalancer.server.port=8080'

  # bastion:
  #   image: debian:12.11-slim
  #   command: sleep infinity
  #   networks:
  #     - snowflake-network
  #   restart: unless-stopped

  postgres:
    image: postgres:17.5-alpine3.22
    # ports:
    #   - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - snowflake-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5.3
    # ports:
    #   - '3100:3100'
    volumes:
      - ./_config/loki:/etc/loki:ro
    command: -config.file=/etc/loki/loki-config.yaml
    networks:
      - snowflake-network
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.loki.rule=Host(`loki.localhost`)'
      - 'traefik.http.services.loki.loadbalancer.server.port=3100'

  grafana:
    image: grafana/grafana:12.1.0
    # ports:
    #   - '3000:3000'
    networks:
      - snowflake-network
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.localhost`)'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'

  openfga_migrate:
    image: openfga/openfga:v1.9.5
    depends_on:
      postgres:
        condition: service_healthy
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@postgres:5432/openfga?sslmode=disable
    networks:
      - snowflake-network

  openfga:
    image: openfga/openfga:v1.9.5
    depends_on:
      openfga_migrate:
        condition: service_completed_successfully
    command: run
    # ports:
    #   - '2112:2112'
    #   - '3001:3000'
    #   - '8080:8080'
    #   - '8081:8081'
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@postgres:5432/openfga?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=true
    networks:
      - snowflake-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/usr/local/bin/grpc_health_probe', '-addr=openfga:8081']
      interval: 5s
      timeout: 30s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.openfga.rule=Host(`openfga.localhost`)'
      - 'traefik.http.services.openfga.loadbalancer.server.port=3000'

  redis:
    image: redis:8.2.1-alpine3.22
    # ports:
    #   - '6379:6379'
    command: --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - snowflake-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  authentik_server:
    image: ghcr.io/goauthentik/server:2025.8.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ports:
    #   - '9000:9000'
    #   - '9443:9443'
    command: server
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: postgres
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_REDIS__HOST: redis
    volumes:
      - ./_config/authentik/media:/media
      - ./_config/authentik/custom-templates:/templates
    networks:
      - snowflake-network
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authentik.rule=Host(`authentik.localhost`)'
      - 'traefik.http.services.authentik.loadbalancer.server.port=9000'

  authentik_worker:
    image: ghcr.io/goauthentik/server:2025.8.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: worker
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: postgres
      AUTHENTIK_POSTGRESQL__USER: postgres
      AUTHENTIK_REDIS__HOST: redis
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./_config/authentik/media:/media
      - ./_config/authentik/certs:/certs
      - ./_config/authentik/custom-templates:/templates
    networks:
      - snowflake-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  snowflake-network:
    driver: bridge
