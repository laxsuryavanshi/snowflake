services:
  db:
    image: postgres:17.5-alpine3.22
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: idms
    build:
      context: ../..
      dockerfile: ./Dockerfile
    depends_on:
      - db
    env_file: .env
    ports:
      - 3000:3000

volumes:
  pgdata:
