<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Boids Simulation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        color: white;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #controls {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        z-index: 1000;
        min-width: 250px;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
      }

      .control-group input[type='range'] {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: #333;
        outline: none;
        -webkit-appearance: none;
      }

      .control-group input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #00ffff;
        cursor: pointer;
      }

      .control-group input[type='range']::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #00ffff;
        cursor: pointer;
        border: none;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div class="control-group">
        <label for="alignment">Alignment: <span id="alignment-value">0.15</span></label>
        <input type="range" id="alignment" min="0" max="0.5" step="0.01" value="0.15" />
      </div>
      <div class="control-group">
        <label for="cohesion">Cohesion: <span id="cohesion-value">0.02</span></label>
        <input type="range" id="cohesion" min="0" max="0.1" step="0.001" value="0.02" />
      </div>
      <div class="control-group">
        <label for="separation">Separation: <span id="separation-value">0.3</span></label>
        <input type="range" id="separation" min="0" max="1" step="0.01" value="0.3" />
      </div>
    </div>
    <canvas id="boids"></canvas>
    <script type="module" src="./src/boids.js"></script>
  </body>
</html>
